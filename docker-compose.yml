version: '3.8'

services:
  datacenter-twin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datacenter_digital_twin
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend
    volumes:
      - ./backend/datacenter_twin.db:/app/backend/datacenter_twin.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
