services:
  datacenter-twin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datacenter_digital_twin
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # saved runs (View Past Logs), dataset, benchmark results
      - ./backend/data:/app/backend/data
    restart: unless-stopped
